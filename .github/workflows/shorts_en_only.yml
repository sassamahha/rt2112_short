name: rt2112-shorts-en-only

on:
  workflow_dispatch: {}
  schedule:
    # 18:00 PT （GitHubはUTCで動くので翌日UTC）
    - cron: '0 1 * 3-10 *'   # 18:00 PDT (Mar–Oct) = 01:00 UTC (next day)
    - cron: '0 2 * 11,12 *'  # 18:00 PST (Nov–Dec) = 02:00 UTC (next day)
    - cron: '0 2 * 1,2 *'    # 18:00 PST (Jan–Feb)  = 02:00 UTC (next day)

concurrency:
  group: shorts-en-only
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: npm install --no-audit --no-fund

      # 生成は毎回ランダム。run_number を乱数シードに。
      - name: Generate final.mp4 (EN)
        env:
          VIDEOS_DIR: assets/videos/en
          TAGLINES_TXT: data/en/taglines.txt
          BGM_DIR: assets/bgm/common

          # ランダム化設定
          SEED: ${{ github.run_number }}
          SHUFFLE: '1'

          MIN_DUR: '10'
          MAX_DUR: '25'
          MIX_MODE: 'bgm'
          BGM_VOL: '0.28'
          VIDEO_VOL: '1.0'

          FIT_MODE: 'cover'
          INSET_PCT: '0.98'
          TEXT_MARGIN_PCT: '0.06'
          FONT_SIZE: '72'
          MAX_LINES: '2'
          TAG_POS: 'center'

          BAR_COLOR: 'black'
          BAR_OPACITY: '0.35'
          BAR_PAD_PX: '96'

          TEXT_COLOR: 'white'
          TEXT_BORDERW: '3'
          TEXT_BORDERCOLOR: 'black'

          ALWAYS_ON_COPY: '1'
          COPY_BOX_OPACITY: '0'
          TAIL_OFF_SEC: '0.8'

          TITLE_PREFIX: 'Road to 2112'
        run: node scripts/generate_body.js

      # アップロード（ENチャンネルのトークンだけ切り替え）
      - name: Upload to YouTube (EN channel)
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_EN }}

          # 生成スクリプトが VIDEO_TITLE / VIDEO_DESC / FINAL_MP4 を出さない場合のフォールバック
          VIDEO_TITLE: ${{ env.VIDEO_TITLE || 'Road to 2112 — Short [EN]' }}
          VIDEO_DESC:  ${{ env.VIDEO_DESC  || 'Read on YouTube 📽️ https://youtube.com/@sassamahha\n\nRead on Kindle 📚\nhttps://hub.sassamahha.me' }}
          FINAL_MP4:   ${{ env.FINAL_MP4   || 'final.mp4' }}
          PRIVACY_STATUS: "public"  # 調整中は 'unlisted' に
        run: node scripts/youtube_upload.js
